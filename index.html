<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Colorful Recipe Website</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            max-width: 650px;
            width: 90%;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            color: #e76f51;
            margin-bottom: 10px;
        }

        h2 {
            color: #2a9d8f;
            margin-top: 20px;
        }

        img {
            width: 100%;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        ul, ol {
            text-align: left;
            padding-left: 20px;
            line-height: 1.6;
        }

        button {
            background: #e76f51;
            color: white;
            border: none;
            padding: 12px 22px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background: #d45a3f;
            transform: scale(1.05);
        }

        #instructions {
            display: none;
            margin-top: 15px;
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🍝 Creamy Pasta Recipe</h1>

    <img src="https://bunny-wp-pullzone-o9omkl6wkh.b-cdn.net/wp-content/uploads/2023/05/wp-1684808953872.jpg" alt="Pasta Dish">

    <h2>Ingredients</h2>
    <ul>
        <li>Pasta</li>
        <li>Olive oil</li>
        <li>Garlic</li>
        <li>Cream or tomato sauce</li>
        <li>Salt & pepper</li>
    </ul>

    <button onclick="toggleInstructions()">Show / Hide Instructions</button>

    <button class="toggle-btn" onclick="toggleInstructions()">
                Show Instructions
            </button>

            <div id="instructions" class="hidden">
                <h2>Cooking Instructions</h2>
        <ol>
            <li>Boil pasta until al dente.</li>
            <li>Heat olive oil and sauté garlic.</li>
            <li>Add sauce and simmer.</li>
            <li>Mix pasta with sauce.</li>
            <li>Serve warm and enjoy.</li>
        </ol>
    </div>
</div>

<script>
    function toggleInstructions() {
        const instructions = document.getElementById("instructions");
        instructions.style.display =
            instructions.style.display === "block" ? "none" : "block";
    }
</script>

</body>
</html>
